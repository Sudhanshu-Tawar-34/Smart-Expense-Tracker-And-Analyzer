<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=12">
</head>

<body class="auth-page d-flex align-items-center justify-content-center" style="height:100vh;">

<!-- FLOATING GLOW DOTS -->
<div class="auth-bg"></div>

<!-- Flash Messages -->
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index:999;">
      {% for msg in messages %}
        <div class="alert alert-success shadow-sm text-center px-4 py-2 fade-in">
            {{msg}}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">

            <!-- CARD -->
            <div class="card auth-card p-5 shadow-lg border-0">

                <h3 class="text-center mb-1 title-glow">Welcome Back 👋</h3>
                <p class="text-center text-light small mb-4">Login to continue</p>

                {% if error %}
                <div class="alert alert-danger text-center py-2 fade-in">
                    {{error}}
                </div>
                {% endif %}

                <!-- PREVIEW -->
                <p id="preview" class="text-center glow small fw-bold mb-2"></p>

                <form method="POST" onsubmit="return loading()" id="loginForm">

                    <!-- USERNAME -->
                    <label class="form-label">Username</label>
                    <input id="username"
                           name="username"
                           class="form-control mb-3"
                           placeholder="Enter username"
                           required autofocus>

                    <!-- PASSWORD -->
                    <label class="form-label">Password</label>
                    <input id="password"
                           name="password"
                           type="password"
                           class="form-control mb-2"
                           placeholder="Enter password"
                           required>

                    <!-- OPTIONS -->
                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" onclick="togglePassword()">
                            <label class="form-check-label small">Show</label>
                        </div>

                        <small id="capsWarning" class="text-warning" style="display:none;">
                            Caps Lock ON
                        </small>
                    </div>

                    <!-- BUTTON -->
                    <button id="loginBtn" class="btn btn-primary w-100 mb-3">
                        Login
                    </button>

                </form>

                <hr>

                <!-- SIGNUP -->
                <p class="text-center small mb-0">
                    New user?
                    <a href="/signup" class="fw-bold signup-link">
                        Create Account
                    </a>
                </p>

            </div>

        </div>
    </div>
</div>

<script>

// toggle password
function togglePassword() {
    let pass = document.getElementById("password");
    pass.type = (pass.type === "password") ? "text" : "password";
}

// enter navigation
document.getElementById("username").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("password").focus();
    }
});

// caps lock
document.getElementById("password").addEventListener("keyup", e => {
    document.getElementById("capsWarning").style.display =
        e.getModifierState("CapsLock") ? "block" : "none";
});

// preview
document.getElementById("username").addEventListener("input", function() {
    let val = this.value;
    document.getElementById("preview").innerText =
        val ? "Logging in as " + val : "";
});

// loading
function loading() {
    let btn = document.getElementById("loginBtn");
    btn.innerText = "Logging in...";
    btn.classList.remove("btn-primary");
    btn.classList.add("btn-secondary");
    btn.disabled = true;
    return true;
}

</script>

<style>

/* 🔥 FLOATING BACKGROUND ELEMENT */
.auth-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.auth-bg::before,
.auth-bg::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    background: rgba(0,255,200,0.15);
    filter: blur(120px);
    border-radius: 50%;
    animation: float 10s infinite alternate ease-in-out;
}

.auth-bg::after {
    top: 60%;
    left: 60%;
    background: rgba(0,123,255,0.15);
    animation-delay: 3s;
}

@keyframes float {
    from { transform: translate(0,0); }
    to { transform: translate(80px,-60px); }
}

/* signup link */
.signup-link {
    color: #00ffc3;
    text-decoration: none;
}
.signup-link:hover {
    color: #66ffe0;
    text-decoration: underline;
}

</style>

</body>
</html>
