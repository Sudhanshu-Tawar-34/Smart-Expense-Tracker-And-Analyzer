<!DOCTYPE html>
<html>
<head>
    <title>Add Goal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=7">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-black px-3 shadow-sm">
    <span class="navbar-brand fw-bold">💰 Expense Tracker</span>

    <div class="d-flex gap-2">
        <a href="/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
        <a href="/add" class="btn btn-outline-success btn-sm">Smart Entry</a>
        <a href="/history" class="btn btn-outline-info btn-sm">History</a>
        <a href="/analysis" class="btn btn-outline-warning btn-sm">Analysis</a>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<!-- FLASH -->
{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index:999;">
    {% for msg in messages %}
    <div class="alert alert-success text-center px-4 py-2 fade-in shadow">
        {{msg}}
    </div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}

<div class="container mt-5 col-md-5">

    <div class="card auth-card p-4">

        <h3 class="text-center mb-1 title-glow">Set a Goal 🎯</h3>
        <p class="text-center text-light small mb-3">Plan your savings smartly</p>

        <!-- PREVIEW -->
        <p id="preview" class="text-center glow fw-bold mb-2"></p>

        <!-- HINT -->
        <div id="hintBox" class="alert alert-info text-center py-2"
             style="display:none;"></div>

        <form method="POST" onsubmit="return validateForm()">

            <!-- NAME -->
            <label class="form-label">Goal Name</label>
            <input id="name"
                   name="name"
                   class="form-control mb-3"
                   placeholder="e.g. Buy Laptop"
                   required autofocus>

            <!-- TARGET -->
            <label class="form-label">Target Amount</label>
            <input id="target"
                   name="target"
                   type="number"
                   step="0.01"
                   class="form-control mb-2"
                   required>

            <div id="error" class="text-danger small mb-2" style="display:none;">
                Enter a valid amount ❌
            </div>

            <!-- QUICK BUTTONS -->
            <div class="d-flex justify-content-between mb-2">
                <button type="button" class="btn btn-outline-light btn-sm flex-fill mx-1" onclick="setValue(5000)">₹5000</button>
                <button type="button" class="btn btn-outline-light btn-sm flex-fill mx-1" onclick="setValue(10000)">₹10000</button>
                <button type="button" class="btn btn-outline-light btn-sm flex-fill mx-1" onclick="setValue(20000)">₹20000</button>
            </div>

            <!-- ADJUST -->
            <div class="d-flex justify-content-between mb-3">
                <button type="button" class="btn btn-success btn-sm flex-fill mx-1"
                        onmousedown="startAdjust(100)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">+100</button>

                <button type="button" class="btn btn-success btn-sm flex-fill mx-1"
                        onmousedown="startAdjust(500)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">+500</button>

                <button type="button" class="btn btn-danger btn-sm flex-fill mx-1"
                        onmousedown="startAdjust(-100)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">-100</button>
            </div>

            <!-- SLIDER -->
            <input type="range" id="slider"
                   min="0" max="50000" step="100"
                   class="form-range mb-3">

            <!-- ACTION BUTTONS -->
            <div class="d-flex gap-2">
                <button id="btn" class="btn btn-primary w-100">Add Goal</button>
                <button type="reset" class="btn btn-outline-light w-100">Reset</button>
            </div>

        </form>

    </div>

</div>

<script>

// INPUTS
let nameInput = document.getElementById("name");
let targetInput = document.getElementById("target");
let slider = document.getElementById("slider");

// SYNC
targetInput.addEventListener("input", () => {
    slider.value = targetInput.value;
    updatePreview();
});

slider.addEventListener("input", () => {
    targetInput.value = slider.value;
    updatePreview();
});

// QUICK
function setValue(val) {
    targetInput.value = val;
    slider.value = val;
    updatePreview();
}

// ADJUST
let interval = null;

function adjustValue(val) {
    let current = parseFloat(targetInput.value) || 0;
    let newVal = Math.max(0, current + val);

    targetInput.value = newVal;
    slider.value = newVal;

    // glow feedback
    targetInput.style.boxShadow = "0 0 10px #00ffc3";
    setTimeout(() => targetInput.style.boxShadow = "", 150);

    updatePreview();
}

function startAdjust(val) {
    adjustValue(val);
    interval = setInterval(() => adjustValue(val), 120);
}

function stopAdjust() {
    clearInterval(interval);
}

// PREVIEW + SMART HINT
function updatePreview() {
    let name = nameInput.value;
    let target = targetInput.value;
    let preview = document.getElementById("preview");
    let hint = document.getElementById("hintBox");

    if (name && target) {
        preview.innerText = "Goal: " + name + " (₹" + target + ")";

        if (target < 1000) {
            hint.style.display = "block";
            hint.innerText = "💡 Small goal — quick win!";
        }
        else if (target > 20000) {
            hint.style.display = "block";
            hint.innerText = "⚠️ Big goal — plan your savings.";
        }
        else {
            hint.style.display = "block";
            hint.innerText = "👍 Balanced goal.";
        }
    } else {
        preview.innerText = "";
        hint.style.display = "none";
    }
}

// LISTENERS
nameInput.addEventListener("input", updatePreview);
targetInput.addEventListener("input", updatePreview);

// VALIDATION
function validateForm() {
    let val = targetInput.value;
    let error = document.getElementById("error");
    let btn = document.getElementById("btn");

    if (!val || val <= 0) {
        error.style.display = "block";
        return false;
    }

    error.style.display = "none";

    btn.innerText = "Saving...";
    btn.disabled = true;

    return true;
}

</script>

</body>
</html>
