<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-white">

<nav class="navbar navbar-dark bg-black px-3">
    <span class="navbar-brand">💰 Expense Tracker</span>

    <div>
        <a href="/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
        <a href="/history" class="btn btn-outline-info btn-sm">History</a>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

{% with messages = get_flashed_messages() %}
  {% if messages %}
    <div class="container mt-3">
      {% for msg in messages %}
        <div class="alert alert-success text-center">
            {{msg}}
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<div class="container mt-5 col-md-5">
    <div class="card p-4 bg-secondary shadow">

        <h3 class="text-center mb-2">Edit Expense ✏️</h3>
        <p class="text-center text-light small mb-2">Modify your transaction</p>

        <!-- ORIGINAL -->
        <div class="alert alert-dark text-center py-2">
            Original: ₹{{data[2]}} | {{data[3]}} | {{data[4]}}
        </div>

        <!-- PREVIEW -->
        <p id="preview" class="text-center text-warning fw-bold"></p>

        <!-- WARNING -->
        <div id="warningBox" class="alert alert-danger text-center py-2" style="display:none;"></div>

        <form method="POST" onsubmit="return validateForm()">

            <!-- AMOUNT -->
            <label class="form-label">Amount</label>
            <input id="amount"
                   name="amount"
                   type="number"
                   step="0.01"
                   value="{{data[2]}}"
                   class="form-control mb-2"
                   required>

            <div id="amountError" class="text-danger small mb-2" style="display:none;">
                Invalid amount ❌
            </div>

            <!-- QUICK SET -->
            <div class="mb-2">
                <button type="button" class="btn btn-sm btn-outline-light m-1" onclick="setValue(500)">₹500</button>
                <button type="button" class="btn btn-sm btn-outline-light m-1" onclick="setValue(1000)">₹1000</button>
                <button type="button" class="btn btn-sm btn-outline-light m-1" onclick="setValue(2000)">₹2000</button>
            </div>

            <!-- ADJUST -->
            <div class="mb-2">
                <button type="button" class="btn btn-sm btn-outline-success m-1"
                        onmousedown="startAdjust(100)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">+100</button>

                <button type="button" class="btn btn-sm btn-outline-success m-1"
                        onmousedown="startAdjust(500)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">+500</button>

                <button type="button" class="btn btn-sm btn-outline-danger m-1"
                        onmousedown="startAdjust(-100)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">-100</button>
            </div>

            <!-- SLIDER -->
            <input type="range" id="slider"
                   min="0" max="10000" step="50"
                   class="form-range mb-3">

            <!-- CATEGORY -->
            <label class="form-label">Category</label>
            <select id="category" name="category"
                    class="form-control mb-3"
                    onchange="toggleCustom()" required>
                <option {% if data[3]=='Food' %}selected{% endif %}>Food</option>
                <option {% if data[3]=='Travel' %}selected{% endif %}>Travel</option>
                <option {% if data[3]=='Shopping' %}selected{% endif %}>Shopping</option>
                <option {% if data[3]=='Recharge' %}selected{% endif %}>Recharge</option>
                <option {% if data[3] not in ['Food','Travel','Shopping','Recharge'] %}selected{% endif %}>Others</option>
            </select>

            <!-- CUSTOM -->
            <div id="customBox"
                 style="display: {{ 'block' if data[3] not in ['Food','Travel','Shopping','Recharge'] else 'none' }};">
                <input name="custom_category"
                       class="form-control mb-3"
                       value="{% if data[3] not in ['Food','Travel','Shopping','Recharge'] %}{{data[3]}}{% endif %}">
            </div>

            <!-- DATE -->
            <label class="form-label">Date</label>
            <input name="date"
                   type="date"
                   value="{{data[4]}}"
                   class="form-control mb-3"
                   required>

            <!-- NOTE -->
            <input name="note"
                   value="{{data[5]}}"
                   class="form-control mb-3"
                   placeholder="Optional note">

            <!-- BUTTONS -->
            <div class="d-flex gap-2">
                <button id="btn" class="btn btn-warning w-100">Update</button>
                <a href="/history" class="btn btn-light w-100">Cancel</a>
            </div>

        </form>

    </div>
</div>

<script>

// INPUTS
let input = document.getElementById("amount");
let slider = document.getElementById("slider");

// SYNC
input.addEventListener("input", () => {
    slider.value = input.value;
    updatePreview();
});

slider.addEventListener("input", () => {
    input.value = slider.value;
    updatePreview();
});

// QUICK SET
function setValue(val) {
    input.value = val;
    slider.value = val;
    updatePreview();
}

// ADJUST
function adjustValue(val) {
    let current = parseFloat(input.value) || 0;
    let newVal = Math.max(0, current + val);

    input.value = newVal;
    slider.value = newVal;

    input.classList.add("border-warning");
    setTimeout(() => input.classList.remove("border-warning"), 150);

    updatePreview();
}

// LONG PRESS
let interval = null;

function startAdjust(val) {
    adjustValue(val);
    interval = setInterval(() => adjustValue(val), 120);
}

function stopAdjust() {
    clearInterval(interval);
}

// PREVIEW
function updatePreview() {
    let val = input.value;
    let preview = document.getElementById("preview");
    let warn = document.getElementById("warningBox");

    if (!val) {
        preview.innerText = "";
        warn.style.display = "none";
        return;
    }

    preview.innerText = "Updating to ₹" + val;

    if (val > 2000) {
        warn.style.display = "block";
        warn.innerText = "⚠️ Large expense!";
    } else {
        warn.style.display = "none";
    }
}

// CATEGORY
function toggleCustom() {
    let cat = document.getElementById("category").value;
    document.getElementById("customBox").style.display =
        (cat === "Others") ? "block" : "none";
}

// VALIDATION
function validateForm() {
    let val = input.value;
    let error = document.getElementById("amountError");
    let btn = document.getElementById("btn");

    if (!val || val <= 0) {
        error.style.display = "block";
        return false;
    }

    if (!confirm("Confirm update?")) return false;

    error.style.display = "none";

    btn.innerText = "Updating...";
    btn.disabled = true;

    return true;
}

</script>

</body>
</html>
