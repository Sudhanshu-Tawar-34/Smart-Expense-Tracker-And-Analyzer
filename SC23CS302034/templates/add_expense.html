<!DOCTYPE html>
<html>
<head>
    <title>Smart Entry</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=7">
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-black px-3 shadow-sm">
    <span class="navbar-brand fw-bold">💰 Expense Tracker</span>

    <div class="d-flex gap-2">
        <a href="/dashboard" class="btn btn-outline-light btn-sm">Dashboard</a>
        <a href="/history" class="btn btn-outline-info btn-sm">History</a>
        <a href="/analysis" class="btn btn-outline-warning btn-sm">Analysis</a>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
</nav>

<!-- FLASH -->
{% with messages = get_flashed_messages() %}
{% if messages %}
<div class="position-fixed top-0 start-50 translate-middle-x mt-3" style="z-index:999;">
    {% for msg in messages %}
    <div class="alert alert-success text-center px-4 py-2 fade-in shadow">
        {{msg}}
    </div>
    {% endfor %}
</div>
{% endif %}
{% endwith %}

<div class="container mt-5 col-md-5">

    <div class="card auth-card p-4">

        <h3 class="text-center mb-1 title-glow">Smart Entry ⚡</h3>
        <p class="text-center text-light small mb-3">Add Expense, Income or Goal</p>

        <!-- TYPE SWITCH -->
        <select id="type" class="form-control mb-3" onchange="switchMode()">
            <option value="expense">Expense 💸</option>
            <option value="income">Income 💰</option>
            <option value="goal">Goal 🎯</option>
        </select>

        <!-- FORM -->
        <form id="mainForm" method="POST" action="/add" onsubmit="return validateForm()">

            <!-- AMOUNT -->
            <label class="form-label">Amount</label>
            <input id="amount" name="amount" type="number" step="0.01"
                   class="form-control mb-2" required>

            <!-- PREVIEW -->
            <p id="preview" class="text-center glow fw-bold mb-2"></p>

            <!-- QUICK BUTTONS -->
            <div class="d-flex justify-content-between mb-2">
                <button type="button" class="btn btn-outline-light btn-sm flex-fill mx-1" onclick="setValue(500)">₹500</button>
                <button type="button" class="btn btn-outline-light btn-sm flex-fill mx-1" onclick="setValue(1000)">₹1000</button>
                <button type="button" class="btn btn-outline-light btn-sm flex-fill mx-1" onclick="setValue(5000)">₹5000</button>
            </div>

            <!-- ADJUST -->
            <div class="d-flex justify-content-between mb-3">
                <button type="button" class="btn btn-success btn-sm flex-fill mx-1"
                        onmousedown="startAdjust(100)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">+100</button>

                <button type="button" class="btn btn-success btn-sm flex-fill mx-1"
                        onmousedown="startAdjust(500)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">+500</button>

                <button type="button" class="btn btn-danger btn-sm flex-fill mx-1"
                        onmousedown="startAdjust(-100)" onmouseup="stopAdjust()" onmouseleave="stopAdjust()">-100</button>
            </div>

            <!-- SLIDER -->
            <input type="range" id="slider" min="0" max="10000" step="50"
                   class="form-range mb-3">

            <!-- CATEGORY -->
            <div id="categoryBox">
                <label class="form-label">Category</label>
                <select name="category" id="category"
                        class="form-control mb-3"
                        onchange="toggleCustom()">
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Recharge</option>
                    <option>Others</option>
                </select>

                <div id="customBox" style="display:none;">
                    <input name="custom_category"
                           class="form-control mb-3"
                           placeholder="Custom category">
                </div>
            </div>

            <!-- INCOME -->
            <div id="incomeBox" style="display:none;">
                <label class="form-label">Source</label>
                <input name="source" class="form-control mb-3">
            </div>

            <!-- GOAL -->
            <div id="goalBox" style="display:none;">
                <label class="form-label">Goal Name</label>
                <input name="name" class="form-control mb-3">
            </div>

            <!-- DATE -->
            <label class="form-label">Date</label>
            <input name="date" type="date" id="dateField"
                   class="form-control mb-3" required>

            <!-- NOTE -->
            <input name="note" class="form-control mb-3"
                   placeholder="Optional note">

            <!-- ALERT -->
            <div id="alertBox" class="alert alert-warning text-center py-2"
                 style="display:none;"></div>

            <!-- ACTION BUTTONS -->
            <div class="d-flex gap-2">
                <button id="submitBtn" class="btn btn-primary w-100">Save</button>
                <button type="reset" class="btn btn-outline-light w-100">Reset</button>
            </div>

        </form>

    </div>

</div>

<script>

// DATE
document.getElementById("dateField").valueAsDate = new Date();

// MODE SWITCH
function switchMode() {
    let type = document.getElementById("type").value;
    let form = document.getElementById("mainForm");

    form.action = (type === "expense") ? "/add" :
                  (type === "income") ? "/add_income" :
                  "/add_goal";

    document.getElementById("categoryBox").style.display = (type === "expense") ? "block" : "none";
    document.getElementById("incomeBox").style.display = (type === "income") ? "block" : "none";
    document.getElementById("goalBox").style.display = (type === "goal") ? "block" : "none";

    updatePreview();
}

// CUSTOM CATEGORY
function toggleCustom() {
    let cat = document.getElementById("category").value;
    document.getElementById("customBox").style.display = (cat === "Others") ? "block" : "none";
}

// INPUT SYNC
let amountInput = document.getElementById("amount");
let slider = document.getElementById("slider");

amountInput.addEventListener("input", () => {
    slider.value = amountInput.value;
    updatePreview();
});

slider.addEventListener("input", () => {
    amountInput.value = slider.value;
    updatePreview();
});

// QUICK
function setValue(val) {
    amountInput.value = val;
    slider.value = val;
    updatePreview();
}

// ADJUST
let interval = null;

function adjustValue(val) {
    let current = parseFloat(amountInput.value) || 0;
    let newVal = Math.max(0, current + val);

    amountInput.value = newVal;
    slider.value = newVal;

    amountInput.style.boxShadow = "0 0 10px #00ffc3";
    setTimeout(() => amountInput.style.boxShadow = "", 150);

    updatePreview();
}

function startAdjust(val) {
    adjustValue(val);
    interval = setInterval(() => adjustValue(val), 120);
}

function stopAdjust() {
    clearInterval(interval);
}

// PREVIEW
function updatePreview() {
    let val = amountInput.value;
    let type = document.getElementById("type").value;
    let preview = document.getElementById("preview");

    if (!val) {
        preview.innerText = "";
        return;
    }

    preview.innerText =
        type === "expense" ? "Spending ₹" + val :
        type === "income" ? "Earning ₹" + val :
        "Goal ₹" + val;

    smartAlert(val, type);
}

// ALERT
function smartAlert(amount, type) {
    let box = document.getElementById("alertBox");

    if (type === "expense" && amount > 1000) {
        box.style.display = "block";
        box.innerText = "⚠️ Large expense!";
    } else {
        box.style.display = "none";
    }
}

// VALIDATION
function validateForm() {
    let btn = document.getElementById("submitBtn");
    btn.innerText = "Saving...";
    btn.disabled = true;
    return true;
}

</script>

</body>
</html>
